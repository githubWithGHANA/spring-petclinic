version: 0.0
os: linux
files:
  - source: /
    destination: /opt/spring-petclinic
hooks:
  ApplicationStop:
    - location: scripts/stop-docker.sh
      timeout: 60
      runas: root
  AfterInstall:
    - location: scripts/start-docker.sh
      timeout: 300
      runas: root
  ValidateService:
    - location: scripts/validate.sh
      timeout: 120
      runas: root
